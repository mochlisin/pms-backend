services:
  app:
    build: .
    ports: ["3000:3000"]
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/pms_db?schema=public
      JWT_SECRET: dev-only-change-this-secret
    depends_on:
      db: { condition: service_healthy }
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pms_db
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  pgdata:
