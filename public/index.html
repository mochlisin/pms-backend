<!doctype html>
<meta charset="utf-8">
<title>PMS Login</title>
<style>
body{font-family:system-ui,sans-serif;background:#111;color:#eee;display:grid;place-items:center;height:100vh;margin:0}
form{background:#1d1d22;padding:28px;border-radius:10px;width:300px;display:grid;gap:10px}
input,button,a.btn{padding:10px;border-radius:6px;border:1px solid #333;background:#111;color:#eee;font-size:14px;box-sizing:border-box}
button{background:#3b82f6;border:0;cursor:pointer;font-weight:600}
a.btn{background:#fff;color:#111;text-align:center;text-decoration:none;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
a.link{color:#60a5fa;font-size:13px;text-align:center;text-decoration:none}
a.link:hover{text-decoration:underline}
pre{white-space:pre-wrap;word-break:break-all;font-size:12px;color:#9ca3af;margin:0}
</style>
<form id="f">
  <h2 style="margin:0 0 6px">PMS Login</h2>
  <input name="email" type="email" placeholder="email" required>
  <input name="password" type="password" placeholder="password" required>
  <button type="submit">Login</button>
  <a class="btn" href="/api/auth/google">
    <svg width="16" height="16" viewBox="0 0 24 24"><path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.8 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.4 9 5 12 5z"/><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/><path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.8s.2-2.1.4-2.8L1.9 6.3C.7 8.7 0 10.3 0 12s.7 3.3 1.9 5.7l3.7-2.9z"/><path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2-6.4-4.8L1.9 16.4C3.7 20.1 7.5 23 12 23z"/></svg>
    Login dengan Google
  </a>
  <a class="link" href="/register.html">Belum punya akun? Daftar Baru</a>
  <pre id="out"></pre>
</form>
<script>
f.onsubmit = async e => {
  e.preventDefault();
  const b = Object.fromEntries(new FormData(f));
  const r = await fetch('/api/auth/login', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(b)
  });
  const j = await r.json();
  out.textContent = JSON.stringify(j, null, 2);
  if (j.token) localStorage.setItem('token', j.token);
};
</script>
